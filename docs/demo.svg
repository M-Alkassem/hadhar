<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 721" role="img" aria-label="Two example chats: a phishing text in English and a delivery-fee scam in Arabic, each answered with a verdict, evidence and what to do">
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans Arabic","Geeza Pro",sans-serif;fill:#e2e8f0}
.h{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#7dd3fc}
.t{font-size:20px;font-weight:700}
.cap{font-size:11px;font-weight:600;letter-spacing:.1em;fill:#64748b}
.m{font-size:14px}.v{font-size:15px;font-weight:700}
.in{fill:#1e293b}.out{fill:#0b3a2e;stroke:#134e4a;stroke-width:1}
</style>
<rect width="952" height="721" rx="16" fill="#0f172a"/>
<text x="24" y="38" class="h">HADHAR · حذار</text>
<text x="24" y="64" class="t">Forward it. Know in seconds.</text>
<text x="52" y="92" class="cap">ENGLISH</text><rect x="24" y="110" width="440" height="106" rx="14" class="in"/><text x="52" y="134" text-anchor="start" class="m">Your PayPal account has been suspended. Verify</text><text x="52" y="155" text-anchor="start" class="m">within 24 hours:</text><text x="52" y="176" text-anchor="start" class="m">http://paypal-secure.top/login and send the</text><text x="52" y="197" text-anchor="start" class="m">code we text you</text><rect x="24" y="226" width="440" height="379" rx="14" class="out"/><text x="52" y="250" text-anchor="start" class="v">🔴 Very likely a scam  (91/100)</text><text x="52" y="271" text-anchor="start" class="m"></text><text x="52" y="292" text-anchor="start" class="m">Why:</text><text x="52" y="313" text-anchor="start" class="m">• The address imitates paypal but is not its</text><text x="52" y="334" text-anchor="start" class="m">  real website</text><text x="52" y="355" text-anchor="start" class="m">• It pressures you to act fast or threatens to</text><text x="52" y="376" text-anchor="start" class="m">  lock something</text><text x="52" y="397" text-anchor="start" class="m">• ".top" addresses are heavily used in scams</text><text x="52" y="418" text-anchor="start" class="m">• It tells you to open a link and act on it</text><text x="52" y="439" text-anchor="start" class="m"></text><text x="52" y="460" text-anchor="start" class="m">What to do:</text><text x="52" y="481" text-anchor="start" class="m">• Do not click, reply or send any code.</text><text x="52" y="502" text-anchor="start" class="m">• If it claims to be your bank or a company,</text><text x="52" y="523" text-anchor="start" class="m">  call them on the number printed on your card</text><text x="52" y="544" text-anchor="start" class="m">  or their official website.</text><text x="52" y="565" text-anchor="start" class="m">• If you already clicked or shared something:</text><text x="52" y="586" text-anchor="start" class="m">  change that password now and call your bank.</text><text x="516" y="92" class="cap">ARABIC · العربية</text><rect x="488" y="110" width="440" height="85" rx="14" class="in"/><text x="900" y="134" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">شحنتك معلقة في الجمارك. سدد رسوم التوصيل</text><text x="900" y="155" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">15 ريال خلال 24 ساعة:</text><text x="900" y="176" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">aramex-pay.click/track</text><rect x="488" y="205" width="440" height="442" rx="14" class="out"/><text x="900" y="229" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="v">🔴 احتيال على الأغلب  (100/100)</text><text x="900" y="250" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m"></text><text x="900" y="271" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">السبب:</text><text x="900" y="292" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">• العنوان ينتحل اسم aramex وليس موقعه</text><text x="900" y="313" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">  الحقيقي</text><text x="900" y="334" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">• يدّعي وجود شحنة أو غرامة بانتظار دفع</text><text x="900" y="355" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">  مبلغ</text><text x="900" y="376" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">• يضغط عليك للتصرف بسرعة أو يهدد بإيقاف</text><text x="900" y="397" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">  شيء ما</text><text x="900" y="418" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">• نطاقات ".click" تُستخدم كثيراً في</text><text x="900" y="439" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">  الاحتيال</text><text x="900" y="460" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m"></text><text x="900" y="481" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">ماذا تفعل:</text><text x="900" y="502" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">• لا تضغط على أي رابط ولا ترد ولا ترسل</text><text x="900" y="523" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">  أي رمز.</text><text x="900" y="544" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">• إذا ادّعت الرسالة أنها من بنك أو شركة،</text><text x="900" y="565" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">  اتصل بهم على الرقم المطبوع على بطاقتك أو</text><text x="900" y="586" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">  في موقعهم الرسمي.</text><text x="900" y="607" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">• إذا ضغطت على الرابط أو أرسلت شيئاً:</text><text x="900" y="628" text-anchor="start" direction="rtl" unicode-bidi="plaintext" class="m">  غيّر كلمة المرور فوراً واتصل بالبنك.</text>
<text x="24" y="703" style="font-size:12px;fill:#64748b">Real output of the engine, offline run (no domain-age lookup). With network, young domains and blocklist hits push these higher.</text>
</svg>

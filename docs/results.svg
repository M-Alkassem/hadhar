<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Held-out results: share of scams caught, caught as red, and false alarms on normal items for three test sets">
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e2e8f0}
.h{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#7dd3fc}.big{font-size:20px;font-weight:700}
.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#94a3b8}.v{font-size:14px;font-weight:700}.ok{font-size:15px;font-weight:700;fill:#4ade80}
.track{fill:#1e293b}.amber{fill:#f59e0b}.red{fill:#ef4444}
</style>
<rect width="960" height="440" rx="16" fill="#0f172a"/>
<text x="32" y="40" class="h">HELD-OUT TEST HALF</text>
<text x="32" y="66" class="big">How many scams does it catch?</text>
<rect x="300" y="82" width="12" height="12" rx="3" class="amber"/><text x="318" y="93" class="s">caught (amber or red)</text>
<rect x="470" y="82" width="12" height="12" rx="3" class="red"/><text x="488" y="93" class="s">caught as red (strongest verdict)</text>
<text x="32" y="132" class="t">Real phishing URLs</text><text x="32" y="152" class="s">OpenPhish vs Tranco domains</text><rect x="300" y="118" width="400" height="22" rx="6" class="track"/><rect x="300" y="118" width="282.6666666666667" height="22" rx="6" class="amber"/><text x="712" y="134" class="v">70.7%</text><rect x="300" y="148" width="400" height="22" rx="6" class="track"/><rect x="300" y="148" width="80" height="22" rx="6" class="red"/><text x="712" y="164" class="v">20.0%</text><text x="776" y="134" class="s">false alarms:</text><text x="776" y="154" class="ok">0 of 76</text><text x="32" y="228" class="t">SMS spam</text><text x="32" y="248" class="s">UCI collection, 150 + 150</text><rect x="300" y="214" width="400" height="22" rx="6" class="track"/><rect x="300" y="214" width="285.3333333333333" height="22" rx="6" class="amber"/><text x="712" y="230" class="v">71.3%</text><rect x="300" y="244" width="400" height="22" rx="6" class="track"/><rect x="300" y="244" width="98.66666666666669" height="22" rx="6" class="red"/><text x="712" y="260" class="v">24.7%</text><text x="776" y="230" class="s">false alarms:</text><text x="776" y="250" class="ok">1 of 150</text><text x="32" y="324" class="t">Hand-written EN + AR</text><text x="32" y="344" class="s">author-written, not independent</text><rect x="300" y="310" width="400" height="22" rx="6" class="track"/><rect x="300" y="310" width="387.5" height="22" rx="6" class="amber"/><text x="712" y="326" class="v">96.9%</text><rect x="300" y="340" width="400" height="22" rx="6" class="track"/><rect x="300" y="340" width="325" height="22" rx="6" class="red"/><text x="712" y="356" class="v">81.3%</text><text x="776" y="326" class="s">false alarms:</text><text x="776" y="346" class="ok">0 of 32</text>
<text x="32" y="418" class="s">Heuristics only: the live phishing blocklist is excluded so the feed can't grade itself. Samples are small (75 to 150 per class), roughly ±7 to ±10 points.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Hadhar workflow: message in, links inspected safely, signals scored, optional model can only raise the verdict, reply and family alert out">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e2e8f0; }
      .t { font-size: 15px; font-weight: 600; }
      .s { font-size: 12px; fill: #94a3b8; }
      .h { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: #7dd3fc; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.2; }
      .hot { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.6; }
      .opt { fill: #1e293b; stroke: #a78bfa; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .ln { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="960" height="400" rx="16" fill="#0f172a"/>
  <text x="32" y="40" class="h">HADHAR · حذار</text>
  <text x="32" y="62" style="font-size:20px;font-weight:700">Forward it. Know in seconds.</text>

  <!-- in -->
  <rect class="box" x="32" y="110" width="150" height="74" rx="12"/>
  <text x="48" y="140" class="t">Message in</text>
  <text x="48" y="160" class="s">Telegram chat or</text>
  <text x="48" y="175" class="s">test webhook</text>

  <rect class="box" x="32" y="214" width="150" height="74" rx="12"/>
  <text x="48" y="244" class="t">Route</text>
  <text x="48" y="264" class="s">/family /join /leave</text>
  <text x="48" y="279" class="s">else: scan</text>
  <path class="ln" d="M107 184V212"/>

  <!-- scan -->
  <rect class="hot" x="236" y="110" width="250" height="178" rx="12"/>
  <text x="252" y="140" class="t">Scan (n8n Code node)</text>
  <text x="252" y="166" class="s">1 · find links, any language</text>
  <text x="252" y="186" class="s">2 · follow redirects by hand,</text>
  <text x="252" y="201" class="s">    refuse private addresses</text>
  <text x="252" y="221" class="s">3 · domain age (RDAP)</text>
  <text x="252" y="241" class="s">4 · phishing blocklist lookup</text>
  <text x="252" y="261" class="s">5 · EN + AR text patterns</text>
  <path class="ln" d="M182 251H234"/>

  <!-- score -->
  <rect class="box" x="540" y="110" width="170" height="74" rx="12"/>
  <text x="556" y="140" class="t">Score</text>
  <text x="556" y="160" class="s">explainable signals,</text>
  <text x="556" y="175" class="s">red · amber · green</text>
  <path class="ln" d="M486 160H538"/>

  <!-- llm -->
  <rect class="opt" x="540" y="214" width="170" height="74" rx="12"/>
  <text x="556" y="244" class="t">Claude (optional)</text>
  <text x="556" y="264" class="s">can only RAISE a verdict</text>
  <text x="556" y="279" class="s">never lower it</text>
  <path class="ln" d="M625 184V212"/>

  <!-- out -->
  <rect class="box" x="764" y="110" width="164" height="74" rx="12"/>
  <text x="780" y="140" class="t">Reply</text>
  <text x="780" y="160" class="s">verdict · evidence ·</text>
  <text x="780" y="175" class="s">what to do, same language</text>
  <path class="ln" d="M710 150H762"/>
  <path class="ln" d="M710 251C740 251 740 175 762 168"/>

  <rect class="box" x="764" y="214" width="164" height="74" rx="12"/>
  <text x="780" y="244" class="t">Family alert</text>
  <text x="780" y="264" class="s">red verdict → a trusted</text>
  <text x="780" y="279" class="s">person is told (codes hidden)</text>
  <path class="ln" d="M846 184V212"/>

  <text x="32" y="338" class="s">Executions are not stored: messages stay private. The same src/*.js files run in the unit tests and inside the n8n nodes.</text>
  <text x="32" y="358" class="s">Dashed = optional. Everything else works offline of any AI service.</text>
</svg>
